services:
  - type: web
    name: dinner-bot
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: BOT_MODE
        value: webhook
      - key: PORT
        value: 10000
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPPORT_CONTACT
        sync: false
      - key: ADMIN_IDS
        value: '[]'
      - key: PAYMENTS_ENABLED
        value: 'false'
      - key: STARS_PRICE
        value: '149'
