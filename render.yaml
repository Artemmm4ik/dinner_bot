services:
  - type: worker
    name: dinner-bot
    env: python
    region: frankfurt
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m app.main"
    disk:
      name: dinner_bot_data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_PATH
        value: /var/data/dinner_bot.sqlite3
      - key: ADMIN_IDS
        sync: false
      - key: LOG_LEVEL
        value: INFO
